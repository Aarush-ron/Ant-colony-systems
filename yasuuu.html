<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Bio-Pathfinder</title>
  <style>
    body { margin: 0; display: grid; grid-template-columns: 300px 1fr; height: 100vh; background: #020617; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    aside { padding: 20px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; gap: 15px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
    h2 { color: #38bdf8; margin: 0 0 5px 0; font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    
    .control-group { background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    label { display: block; font-size: 11px; color: #94a3b8; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }
    
    select, input, button { width: 100%; padding: 8px; background: #020617; color: white; border: 1px solid #334155; border-radius: 4px; margin-bottom: 5px; outline: none; }
    input[type=range] { padding: 0; height: 4px; margin: 10px 0; cursor: pointer; }
    
    button { cursor: pointer; font-weight: bold; transition: 0.2s; border: none; margin-top: 5px;}
    button.secondary { background: #475569; font-size: 12px; }
    button:hover { opacity: 0.9; }

    #timer-display {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #10b981;
      padding: 10px;
      background: #020617;
      border: 1px solid #10b981;
      border-radius: 6px;
      margin-top: 5px;
    }
    #timer-display.finished { color: #ef4444; border-color: #ef4444; }
    
    #status { font-size: 12px; color: #fbbf24; text-align: center; margin-top: 5px; }
    
    main { position: relative; cursor: crosshair; }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; pointer-events: none; font-size: 12px; border: 1px solid #334155; color: #94a3b8; }
  </style>
</head>
<body>

<aside>
  <h2>Real-Time Pathfinder</h2>

  <div class="control-group">
    <label>1. Tools</label>
    <select id="brush">
      <option value="city">🏙️ Place Cities (Start/End)</option>
      <option value="lake">💧 Place Obstacles</option>
      <option value="eraser">🧹 Eraser</option>
    </select>
    <button class="secondary" id="clear">Reset Simulation</button>
  </div>

  <div class="control-group">
    <label>2. Timer Settings</label>
    <label>Duration: <span id="durVal" style="color:#fff">10s</span></label>
    <input type="range" id="duration" min="3" max="60" value="10">
    
    <label>Countdown</label>
    <div id="timer-display">-- : --</div>
  </div>

  <div class="control-group">
    <label>3. Colony Settings</label>
    <label>Ant Count: <span id="popVal" style="color:#fff">2500</span></label>
    <input type="range" id="pop" min="100" max="5000" step="100" value="2500">
    <label>Speed: <span id="speedVal" style="color:#fff">2.0x</span></label>
    <input type="range" id="speed" min="0.5" max="5.0" step="0.5" value="2.0">
  </div>

  <div id="status">Place 2 Cities to start</div>
</aside>

<main>
  <canvas id="canvas"></canvas>
  <div class="overlay" id="stats">Ready</div>
</main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const statusEl = document.getElementById('status');
const timerEl = document.getElementById('timer-display');
const durVal = document.getElementById('durVal');

// --- Config ---
const GRID_SIZE = 4;
const SENSOR_DIST = 15;
const SENSOR_ANGLE = 0.6; 

let cols, rows;
let grid = [];
let ants = [];
let cities = [];
let solvedPath = [];
let frameCounter = 0; // Added for throttling path calculation

// State
let isRunning = false;
let isFinished = false;
let startTime = 0;
let timeLimit = 10000; 

// --- Init ---
function init() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  cols = Math.ceil(canvas.width / GRID_SIZE);
  rows = Math.ceil(canvas.height / GRID_SIZE);
  
  grid = new Array(cols * rows).fill(0).map(() => ({
    pheromone: 0,
    type: 'empty',
    cityIndex: -1
  }));
  
  cities = [];
  solvedPath = [];
  isRunning = false;
  isFinished = false;
  timerEl.innerText = "-- : --";
  timerEl.classList.remove('finished');
  statusEl.innerText = "Place City A and City B";
  
  spawnAnts();
}

function spawnAnts() {
  const count = parseInt(document.getElementById('pop').value);
  document.getElementById('popVal').innerText = count;
  
  if (ants.length > count) ants.length = count;
  else {
    for(let i=ants.length; i<count; i++) {
        ants.push(createAnt());
    }
  }
}

function createAnt() {
  if (cities.length > 0) {
    const city = cities[Math.floor(Math.random() * cities.length)];
    return {
      x: city.x + (Math.random()-0.5)*10,
      y: city.y + (Math.random()-0.5)*10,
      angle: Math.random() * Math.PI * 2,
      targetCity: (cities.indexOf(city) + 1) % cities.length 
    };
  } else {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      angle: Math.random() * Math.PI * 2,
      targetCity: 0
    };
  }
}

// --- Logic ---
function getCell(x, y) {
  const gx = Math.floor(x / GRID_SIZE);
  const gy = Math.floor(y / GRID_SIZE);
  if (gx < 0 || gx >= cols || gy < 0 || gy >= rows) return null;
  return grid[gy * cols + gx];
}

function sense(ant, angleOffset) {
  const a = ant.angle + angleOffset;
  const x = ant.x + Math.cos(a) * SENSOR_DIST;
  const y = ant.y + Math.sin(a) * SENSOR_DIST;
  const cell = getCell(x, y);
  
  if (!cell) return -5; 
  if (cell.type === 'lake') return -50; 
  if (cell.cityIndex === ant.targetCity) return 500;
  if (cell.cityIndex !== -1 && cell.cityIndex !== ant.targetCity) return -10;
  return cell.pheromone;
}

function update() {
  // Timer Logic
  if (isRunning && cities.length >= 2) {
      const elapsed = Date.now() - startTime;
      const remaining = Math.max(0, timeLimit - elapsed);
      
      timerEl.innerText = (remaining / 1000).toFixed(1) + "s";
      
      // --- MODIFIED: REAL-TIME PATH CALCULATION ---
      // We calculate path every 15 frames (approx 4 times per second)
      // so it doesn't kill performance but looks "live"
      frameCounter++;
      if (frameCounter % 15 === 0) {
        solvePath();
      }

      if (remaining <= 0) {
          isRunning = false;
          isFinished = true;
          timerEl.innerText = "DONE";
          timerEl.classList.add('finished');
          statusEl.innerText = "Simulation Finalized.";
          solvePath(); // One final precise calculation
          return;
      }
  }

  if (!isRunning && isFinished) return; 

  const speedMult = parseFloat(document.getElementById('speed').value);
  document.getElementById('speedVal').innerText = speedMult + "x";

  // Ant Logic
  ants.forEach((ant) => {
    if (cities.length >= 2) {
      const vC = sense(ant, 0);
      const vL = sense(ant, -SENSOR_ANGLE);
      const vR = sense(ant, SENSOR_ANGLE);
      const turnStrength = 0.5 * speedMult;

      if (vC > vL && vC > vR) { /* Straight */ }
      else if (vC < vL && vC < vR) { ant.angle += (Math.random() - 0.5) * 2 * turnStrength; }
      else if (vL > vR) { ant.angle -= turnStrength; }
      else if (vR > vL) { ant.angle += turnStrength; }
    } else {
        ant.angle += (Math.random() - 0.5) * 0.2;
    }

    const moveStep = 1.0 * speedMult; 
    const nextX = ant.x + Math.cos(ant.angle) * moveStep;
    const nextY = ant.y + Math.sin(ant.angle) * moveStep;
    const cell = getCell(nextX, nextY);

    if (cell && cell.type !== 'lake') {
      ant.x = nextX;
      ant.y = nextY;
      cell.pheromone += 2; 
      
      if (cell.cityIndex === ant.targetCity) {
        ant.targetCity = (ant.targetCity + 1) % cities.length;
        ant.angle += Math.PI; 
        cell.pheromone += 100;
      }
    } else {
      ant.angle = Math.random() * Math.PI * 2;
    }
  });

  // Decay
  for (let i = 0; i < grid.length; i++) {
    if (grid[i].pheromone > 1000) grid[i].pheromone = 1000;
    grid[i].pheromone *= 0.96; 
  }
}

// --- Solver (Triggers Dynamically) ---
function solvePath() {
  if (cities.length < 2) return;
  
  solvedPath = [];
  const start = cities[0], end = cities[1];
  const startGx = Math.floor(start.x/GRID_SIZE), startGy = Math.floor(start.y/GRID_SIZE);
  const endGx = Math.floor(end.x/GRID_SIZE), endGy = Math.floor(end.y/GRID_SIZE);

  let openSet = [{ x: startGx, y: startGy, parent: null, g: 0, f: 0 }];
  let closedSet = new Set();
  let iterations = 0;
  let finalNode = null;

  // Reduced max iterations slightly for real-time performance
  while (openSet.length > 0 && iterations < 15000) {
    openSet.sort((a, b) => a.f - b.f);
    const current = openSet.shift();
    const key = `${current.x},${current.y}`;
    
    if (closedSet.has(key)) continue;
    closedSet.add(key);
    iterations++;

    if (Math.hypot(current.x - endGx, current.y - endGy) < 3) {
      finalNode = current;
      break;
    }

    const neighbors = [
      {x:1,y:0, c:1}, {x:-1,y:0, c:1}, {x:0,y:1, c:1}, {x:0,y:-1, c:1},
      {x:1,y:1, c:1.414}, {x:-1,y:-1, c:1.414}, {x:1,y:-1, c:1.414}, {x:-1,y:1, c:1.414}
    ];

    for (let offset of neighbors) {
      const nx = current.x + offset.x;
      const ny = current.y + offset.y;
      
      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
        const nKey = `${nx},${ny}`;
        if (!closedSet.has(nKey)) {
            const cell = grid[ny * cols + nx];
            if (cell.type !== 'lake') {
                // Heuristic: Strongly Prefer High Pheromone
                let cost = offset.c * 10; 
                // Increased pheromone weight for sharper paths
                if (cell.pheromone > 0) cost = Math.max(1, (offset.c * 10) - (cell.pheromone / 30));
                
                const g = current.g + cost;
                const h = Math.hypot(nx - endGx, ny - endGy);
                
                openSet.push({ x: nx, y: ny, parent: current, g: g, f: g + h });
            }
        }
      }
    }
  }

  if (finalNode) {
    let curr = finalNode;
    let rawPath = [];
    while(curr) {
      rawPath.push({x: curr.x * GRID_SIZE + 2, y: curr.y * GRID_SIZE + 2});
      curr = curr.parent;
    }
    // Simplify
    if(rawPath.length > 5) {
        solvedPath.push(rawPath[0]);
        for(let i=1; i<rawPath.length-1; i++) {
           if(i % 4 === 0) solvedPath.push(rawPath[i]); 
        }
        solvedPath.push(rawPath[rawPath.length-1]);
    } else {
        solvedPath = rawPath;
    }
    // Only update status if finalized, otherwise keep timer visible
    if(isFinished) statusEl.innerText = "Shortest Path Found!";
  }
}

// --- Render ---
function draw() {
  ctx.fillStyle = '#020617';
  ctx.fillRect(0,0, canvas.width, canvas.height);

  // Grid
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const cell = grid[y * cols + x];
      if (cell.type === 'lake') {
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(x*GRID_SIZE, y*GRID_SIZE, GRID_SIZE, GRID_SIZE);
      } else if (cell.pheromone > 5) {
        const alpha = Math.min(1, cell.pheromone / 400);
        ctx.fillStyle = `rgba(52, 211, 153, ${alpha})`; 
        ctx.fillRect(x*GRID_SIZE, y*GRID_SIZE, GRID_SIZE, GRID_SIZE);
      }
    }
  }

  // Ants (Show only if running)
  if (!isFinished) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    for (let a of ants) ctx.fillRect(a.x, a.y, 1.5, 1.5);
  }

  // Cities
  cities.forEach((c, i) => {
    ctx.fillStyle = i===0 ? '#10b981' : '#f43f5e';
    ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(i===0?"A":"B", c.x-3, c.y+3);
  });

  // Curve (The path now draws even while running)
  if (solvedPath.length > 1) {
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ef4444';
    
    ctx.beginPath();
    ctx.moveTo(solvedPath[0].x, solvedPath[0].y);
    for (let i = 1; i < solvedPath.length - 2; i++) {
        const xc = (solvedPath[i].x + solvedPath[i + 1].x) / 2;
        const yc = (solvedPath[i].y + solvedPath[i + 1].y) / 2;
        ctx.quadraticCurveTo(solvedPath[i].x, solvedPath[i].y, xc, yc);
    }
    if(solvedPath.length > 2) {
        let last = solvedPath[solvedPath.length-1];
        let secondLast = solvedPath[solvedPath.length-2];
        ctx.quadraticCurveTo(secondLast.x, secondLast.y, last.x, last.y);
    } else {
        ctx.lineTo(solvedPath[1].x, solvedPath[1].y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// --- Interaction ---
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const mode = document.getElementById('brush').value;
  
  if (mode === 'city') {
    if (cities.length >= 2) { init(); return; } 
    cities.push({x, y});
    
    const gx = Math.floor(x/GRID_SIZE), gy = Math.floor(y/GRID_SIZE);
    for(let i=-5; i<=5; i++) for(let j=-5; j<=5; j++) {
        const c = getCell(x + i*GRID_SIZE, y + j*GRID_SIZE);
        if(c) { c.cityIndex = cities.length-1; c.pheromone = 500; }
    }
    
    // Reposition ants
    if (cities.length === 1) ants.forEach(a => { a.x = x; a.y = y; });
    else ants.forEach((a, i) => { 
        const target = i%2; a.targetCity = target;
        const source = cities[1-target]; a.x = source.x; a.y = source.y;
    });

    // Start Timer on 2nd City
    if(cities.length === 2) {
        timeLimit = parseInt(document.getElementById('duration').value) * 1000;
        startTime = Date.now();
        isRunning = true;
        statusEl.innerText = "Simulation Running...";
    }
  } else if (mode === 'lake') {
    for(let i=-6; i<=6; i++) for(let j=-6; j<=6; j++) {
        const c = getCell(x + i*GRID_SIZE, y + j*GRID_SIZE);
        if(c) { c.type = 'lake'; c.pheromone = 0; }
    }
  } else if (mode === 'eraser') {
    for(let i=-6; i<=6; i++) for(let j=-6; j<=6; j++) {
        const c = getCell(x + i*GRID_SIZE, y + j*GRID_SIZE);
        if(c) { c.type = 'empty'; c.pheromone = 0; }
    }
  }
});

document.getElementById('duration').addEventListener('input', (e) => {
    durVal.innerText = e.target.value + "s";
});
document.getElementById('pop').addEventListener('input', spawnAnts);
document.getElementById('clear').onclick = init;

window.addEventListener('resize', init);
init();
loop();
</script>
</body>
</html>
